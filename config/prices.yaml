# Model prices in USD per 1 million tokens, used by the budget gateway to estimate and record
# spend in AUD (via USD_TO_AUD_RATE). Verify against the providers' pricing pages when you set a
# model in .env. The gateway REFUSES to call any model that is not listed here.

anthropic:
  claude-sonnet-5-5: { input: 2.00, output: 10.00 }
  claude-haiku-5-5: { input: 0.10, output: 0.50 } # prompts up to 100K tokens
  claude-opus-5-5: { input: 4.00, output: 20.00 }

# Verified 14 Nov 2026 at platform.openai.com/docs/pricing (standard, short context).
openai:
  gpt-6.1-sol: { input: 2.00, output: 10.00 }
  gpt-6-luna: { input: 0.10, output: 0.50 }

# DeepSeek: priced at PEAK rates (off-peak is half) so estimates are never low. Verified
# 14 Nov 2026 at api-docs.deepseek.com/quick_start/pricing (cache-miss input).
deepseek:
  deepseek-flash: { input: 0.30, output: 1.20 }
  deepseek-v4-pro: { input: 1.32, output: 3.96 }
